<main class="login-page">
  <form class="login-card" (ngSubmit)="submit()" #loginForm="ngForm">
    <img src="/images/Bird_Oragami.png" alt="Travlr Getaways" width="58" height="58">
    <p class="eyebrow">Travlr getaways</p>
    <h1>Admin sign in</h1>
    <p class="description">Use your administrator account to manage trips and messages.</p>

    @if (route.snapshot.queryParamMap.get('reason') === 'session') {
      <p class="notice">Your session has ended. Please sign in again.</p>
    }
    @if (error) {
      <p class="error" role="alert">{{ error }}</p>
    }

    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password">
    <button type="submit" [disabled]="loginForm.invalid || loading">{{ loading ? 'Signing in…' : 'Sign in' }}</button>
  </form>
</main>
